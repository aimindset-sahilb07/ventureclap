<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>VentureClap Logo Options</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter+Tight:wght@700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0E0E10; color: #F4F4F5; font: 15px/1.5 system-ui, sans-serif; padding: 32px 16px; }
    h1 { font: 700 24px 'Space Grotesk', sans-serif; margin: 0 0 24px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); max-width: 1100px; }
    .opt { border: 1px solid #2A2A31; border-radius: 14px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 28px 20px; overflow: hidden; }
    .row.light { background: #F6F4EF; }
    .label { padding: 12px 24px; border-top: 1px solid #2A2A31; color: #A1A1AA; font-size: 13px; }
    .wm { font-size: 30px; letter-spacing: -0.03em; line-height: 1; }
    .a { font-family: 'Space Grotesk'; font-weight: 700; }
    .b { font-family: 'Inter Tight'; font-weight: 800; }
    .c { font-family: 'Syne'; font-weight: 800; letter-spacing: -0.01em; font-size: 24px; }
    svg { flex: none; }
  </style>
</head>
<body>
  <h1>VentureClap logo options</h1>
  <div class="grid">
    <!-- A: amber (current site default) -->
    <div class="opt">
      <div class="row"><img src="images/logo-mark.svg" width="48" height="48" alt=""><span class="wm a" style="color:#fff">Venture<span style="color:#FFB020">Clap</span></span></div>
      <div class="row light"><img src="images/logo-mark.svg" width="48" height="48" alt=""><span class="wm a" style="color:#0E0E10">Venture<span style="color:#D48800">Clap</span></span></div>
      <div class="label">A: Amber + Space Grotesk (used on the site)</div>
    </div>

    <!-- B: electric green, Inter Tight -->
    <div class="opt">
      <div class="row"><svg width="48" height="48" viewBox="0 0 64 64"><rect x="6" y="28" width="52" height="30" rx="5" fill="#3DFFA2"/><rect x="6" y="22" width="52" height="8" rx="2" fill="#3DFFA2"/><path d="M14 22h7l-5 8h-7zM28 22h7l-5 8h-7zM42 22h7l-5 8h-7z" fill="#0E0E10"/><g transform="rotate(-22 7 20)"><rect x="6" y="12" width="52" height="8" rx="2" fill="#fff"/><path d="M14 12h7l-5 8h-7zM28 12h7l-5 8h-7zM42 12h7l-5 8h-7z" fill="#0E0E10"/></g><circle cx="8" cy="21" r="2.6" fill="#0E0E10" stroke="#fff" stroke-width="1.4"/><path d="M16 49l9-7 7 5 14-11" fill="none" stroke="#0E0E10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm b" style="color:#fff">Venture<span style="color:#3DFFA2">Clap</span></span></div>
      <div class="row light"><svg width="48" height="48" viewBox="0 0 64 64"><rect x="6" y="28" width="52" height="30" rx="5" fill="#0E0E10"/><rect x="6" y="22" width="52" height="8" rx="2" fill="#0E0E10"/><path d="M14 22h7l-5 8h-7zM28 22h7l-5 8h-7zM42 22h7l-5 8h-7z" fill="#3DFFA2"/><g transform="rotate(-22 7 20)"><rect x="6" y="12" width="52" height="8" rx="2" fill="#0E0E10"/><path d="M14 12h7l-5 8h-7zM28 12h7l-5 8h-7zM42 12h7l-5 8h-7z" fill="#3DFFA2"/></g><circle cx="8" cy="21" r="2.6" fill="#3DFFA2"/><path d="M16 49l9-7 7 5 14-11" fill="none" stroke="#3DFFA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm b" style="color:#0E0E10">Venture<span style="color:#0FA968">Clap</span></span></div>
      <div class="label">B: Growth green + Inter Tight (feels techier)</div>
    </div>

    <!-- C: red "on air", Syne -->
    <div class="opt">
      <div class="row"><svg width="48" height="48" viewBox="0 0 64 64"><rect x="6" y="28" width="52" height="30" rx="5" fill="#FF4D3D"/><rect x="6" y="22" width="52" height="8" rx="2" fill="#FF4D3D"/><path d="M14 22h7l-5 8h-7zM28 22h7l-5 8h-7zM42 22h7l-5 8h-7z" fill="#0E0E10"/><g transform="rotate(-22 7 20)"><rect x="6" y="12" width="52" height="8" rx="2" fill="#fff"/><path d="M14 12h7l-5 8h-7zM28 12h7l-5 8h-7zM42 12h7l-5 8h-7z" fill="#0E0E10"/></g><circle cx="8" cy="21" r="2.6" fill="#0E0E10" stroke="#fff" stroke-width="1.4"/><path d="M16 49l9-7 7 5 14-11" fill="none" stroke="#0E0E10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm c" style="color:#fff">Venture<span style="color:#FF4D3D">Clap</span></span></div>
      <div class="row light"><svg width="48" height="48" viewBox="0 0 64 64"><rect x="6" y="28" width="52" height="30" rx="5" fill="#FF4D3D"/><rect x="6" y="22" width="52" height="8" rx="2" fill="#FF4D3D"/><path d="M14 22h7l-5 8h-7zM28 22h7l-5 8h-7zM42 22h7l-5 8h-7z" fill="#0E0E10"/><g transform="rotate(-22 7 20)"><rect x="6" y="12" width="52" height="8" rx="2" fill="#0E0E10"/><path d="M14 12h7l-5 8h-7zM28 12h7l-5 8h-7zM42 12h7l-5 8h-7z" fill="#fff"/></g><circle cx="8" cy="21" r="2.6" fill="#fff" stroke="#0E0E10" stroke-width="1.4"/><path d="M16 49l9-7 7 5 14-11" fill="none" stroke="#0E0E10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm c" style="color:#0E0E10">Venture<span style="color:#E03524">Clap</span></span></div>
      <div class="label">C: "On air" red + Syne (bolder, more film/creative)</div>
    </div>
  </div>
</body>
</html>
