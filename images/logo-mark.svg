<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VentureClap">
  <!-- Board body -->
  <rect x="6" y="28" width="52" height="30" rx="5" fill="#FFB020"/>
  <!-- Fixed stripe bar -->
  <g>
    <rect x="6" y="22" width="52" height="8" rx="2" fill="#FFB020"/>
    <path d="M14 22h7l-5 8h-7zM28 22h7l-5 8h-7zM42 22h7l-5 8h-7z" fill="#0E0E10"/>
  </g>
  <!-- Clapper arm, swung open like a rising line -->
  <g transform="rotate(-22 7 20)">
    <rect x="6" y="12" width="52" height="8" rx="2" fill="#FFFFFF"/>
    <path d="M14 12h7l-5 8h-7zM28 12h7l-5 8h-7zM42 12h7l-5 8h-7z" fill="#0E0E10"/>
  </g>
  <!-- Hinge -->
  <circle cx="8" cy="21" r="2.6" fill="#0E0E10" stroke="#FFFFFF" stroke-width="1.4"/>
  <!-- Upward tick inside the board -->
  <path d="M16 49l9-7 7 5 14-11" fill="none" stroke="#0E0E10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
